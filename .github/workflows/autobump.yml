name: Update karls-gitflow

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/autobump.py
      - .github/workflows/autobump.yml
  schedule:
    - cron: 45 5 * * *

permissions: {}

concurrency:
  group: karls-gitflow-autobump
  cancel-in-progress: false

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check upstream release
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/karl-sjogren/karls-gitflow/releases/latest \
            > "$RUNNER_TEMP/upstream-release.json"
          python3 .github/scripts/autobump.py \
            "$RUNNER_TEMP/upstream-release.json" Formula/karls-gitflow.rb

      - name: Create or update pull request
        if: steps.update.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          branch=autobump/karls-gitflow
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Formula/karls-gitflow.rb
          git commit -m "Update karls-gitflow to $VERSION"
          git push --force origin "HEAD:refs/heads/$branch"

          pr_number="$(gh pr list --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "Update karls-gitflow to $VERSION" \
              --body "Update the Homebrew formula to upstream release $VERSION."
          else
            gh pr create --base main --head "$branch" \
              --title "Update karls-gitflow to $VERSION" \
              --body "Update the Homebrew formula to upstream release $VERSION."
          fi
